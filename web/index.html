<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriCoach T2D</title>
<style>
  :root {
    --teal: #0e7c66; --teal-dark: #0a5c4c; --teal-soft: #d9ebe6; --bg: #f2f6f5; --panel: #ffffff;
    --ink: #1c2b28; --muted: #5f736e; --line: #dbe6e3;
    --green: #1a9850; --yellow: #d9a400; --red: #d64541; --blue: #0072b2; --sand: #d9a400;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--teal); color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .logo { width: 36px; height: 36px; border-radius: 11px; background: #fff; color: var(--teal); display: grid; place-items: center; font-size: 20px; }
  header h1 { font-size: 17px; font-weight: 650; }
  header .sub { font-size: 12px; opacity: .85; }
  .hgroup { margin-right: auto; }
  .langs { display: flex; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; overflow: hidden; }
  .langs button { border: 0; background: transparent; color: #fff; font-size: 12px; padding: 5px 12px; cursor: pointer; font-weight: 600; letter-spacing: .03em; }
  .langs button.active { background: #fff; color: var(--teal-dark); }
  .badge { font-size: 10.5px; letter-spacing: .05em; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); padding: 4px 10px; border-radius: 999px; }

  .disclaimer { background: #fff8e6; border-bottom: 1px solid #eadfb8; color: #6b5b1e; font-size: 12.5px; padding: 7px 20px; flex-shrink: 0; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px 20px; max-width: 1180px; width: 100%; margin: 0 auto; min-height: 0; }

  .chat { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 0; overflow: hidden; }
  .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 9px; align-items: flex-end; animation: pop .25s ease; }
  .row.user { justify-content: flex-end; }
  @keyframes pop { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--teal-soft); display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.5; }
  .row.user .msg { background: var(--teal); color: #fff; border-bottom-right-radius: 4px; }
  .row.bot .msg { background: #f7faf9; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 10.5px; color: var(--muted); background: #eef3f2; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }

  /* food card + visuals */
  .card { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; background: #fff; }
  .card .head { background: #eef5f3; font-weight: 650; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; }
  .card .body { padding: 10px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .dot.green { background: var(--green); } .dot.yellow { background: var(--yellow); } .dot.red { background: var(--red); }
  .macro { margin: 3px 0; }
  .macro .lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .macro .lab b { color: var(--ink); font-weight: 600; }
  .track { height: 9px; border-radius: 5px; background: #edf2f1; overflow: hidden; position: relative; }
  .fill { height: 100%; border-radius: 5px; }
  .fill.carb { background: var(--teal); opacity: .85; }
  .fill.sugar { position: absolute; top: 0; left: 0; background: var(--teal-dark); }
  .fill.fiber { background: var(--green); opacity: .8; }
  .fill.prot { background: var(--blue); opacity: .75; }
  .giscale { margin: 10px 0 2px; }
  .giscale .lab { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 3px; }
  .giscale .lab b { font-weight: 650; }
  .gitrack { position: relative; height: 9px; border-radius: 5px; display: flex; overflow: visible; }
  .gz { height: 100%; } .gz.g { width: 55%; background: #bfe3cd; border-radius: 5px 0 0 5px; }
  .gz.y { width: 15%; background: #f3e2ae; } .gz.r { width: 30%; background: #f2c6c4; border-radius: 0 5px 5px 0; }
  .gmark { position: absolute; top: -3px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink); border: 2.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transform: translateX(-50%); }
  .gnums { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--muted); margin-top: 2px; }
  .kcalrow { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }

  .duel { display: flex; gap: 10px; margin-top: 10px; }
  .duel .card { flex: 1; margin-top: 0; }
  .duel .win { border-color: var(--teal); box-shadow: 0 0 0 1.5px var(--teal); }
  .winchip { font-size: 9.5px; color: #fff; background: var(--teal); border-radius: 999px; padding: 2px 8px; font-weight: 600; }

  .plate { display: flex; gap: 14px; align-items: center; margin-top: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .plate svg { flex-shrink: 0; }
  .plate .legend { font-size: 12px; line-height: 1.7; }
  .plate .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }

  .chips { padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); background: #fbfdfc; }
  .chip { font-size: 12.5px; border: 1px solid var(--teal); color: var(--teal-dark); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .chip:hover { background: var(--teal); color: #fff; }

  form { display: flex; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; font-size: 14.5px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff; color: var(--ink); }
  input[type=text]:focus { border-color: var(--teal); }
  button.send { background: var(--teal); color: #fff; border: 0; border-radius: 10px; padding: 10px 20px; font-size: 14.5px; cursor: pointer; }
  button.send:hover { background: var(--teal-dark); }
  button.send:disabled { opacity: .5; cursor: default; }

  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  aside h2 { font-size: 13.5px; padding: 12px 14px 8px; }
  aside .hint { font-size: 11.5px; color: var(--muted); padding: 0 14px 8px; }
  aside input { margin: 0 14px 10px; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; outline: none; }
  .foodlist { flex: 1; overflow-y: auto; font-size: 13px; }
  .foodlist table { width: 100%; border-collapse: collapse; }
  .foodlist td, .foodlist th { padding: 6px 14px; border-top: 1px solid var(--line); text-align: left; }
  .foodlist th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-top: 0; position: sticky; top: 0; background: var(--panel); }
  .foodlist td:nth-child(2), .foodlist td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .foodlist tr { cursor: pointer; }
  .foodlist tr:hover td { background: #f2f8f6; }

  .typing { font-size: 13px; color: var(--muted); padding-left: 41px; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 0 20px 10px; flex-shrink: 0; }

  @media (max-width: 940px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
  <header>
    <div class="logo">&#129367;</div>
    <div class="hgroup">
      <h1>NutriCoach T2D</h1>
      <div class="sub" data-i="sub"></div>
    </div>
    <div class="langs"><button id="lang-en">EN</button><button id="lang-de">DE</button></div>
    <span class="badge" data-i="badge"></span>
  </header>
  <div class="disclaimer" data-i="disclaimer"></div>

  <main>
    <section class="chat">
      <div class="messages" id="messages"></div>
      <div class="chips" id="chips"></div>
      <form id="form" autocomplete="off">
        <input type="text" id="input" maxlength="300">
        <button class="send" id="send" type="submit" data-i="send"></button>
      </form>
    </section>

    <aside>
      <h2 data-i="paneltitle"></h2>
      <div class="hint" data-i="panelhint"></div>
      <input type="text" id="foodsearch">
      <div class="foodlist">
        <table>
          <thead><tr><th data-i="thfood"></th><th data-i="thcarb"></th><th>GI</th></tr></thead>
          <tbody id="foodrows"></tbody>
        </table>
      </div>
    </aside>
  </main>
  <footer><span data-i="footer"></span> &middot; v1.0.1</footer>

<script>
  // ---------- i18n ----------
  const L = {
    en: {
      sub: "Nutrition guidance chatbot for type 2 diabetes",
      badge: "RESEARCH PROTOTYPE",
      disclaimer: "⚠️ Educational proof of concept — not medical advice, not a medical device. For personal guidance talk to your doctor or a registered dietitian.",
      send: "Send", placeholder: 'Try: "Is banana ok?" or "breakfast ideas"',
      paneltitle: "🔍 Food traffic lights",
      panelhint: "Everyday-choice rating for type 2 diabetes. Click a row to ask about it.",
      filter: "Filter foods...", thfood: "Food", thcarb: "Carbs/100g",
      footer: "Runs locally on this computer · no data leaves the machine · knowledge base: curated approximations (USDA / GI tables / ADA & NHS guidance)",
      typing: "NutriCoach is thinking…", lost: "Connection lost - is NutriCoach still running?",
      per100: "per 100 g", carbs: "Carbs", ofSugar: "of which sugar", fiber: "Fiber", protein: "Protein",
      energy: "Energy", gi: "Glycemic index", giNeg: "negligible", giBands: ["low", "medium", "high"],
      ask: n => `Is ${n} ok?`, best: "friendlier choice",
      plate: ["½ non-starchy vegetables", "¼ lean protein", "¼ quality carbs"],
      plateTitle: "The Diabetes Plate", greetWord: "hello",
    },
    de: {
      sub: "Ernährungs-Chatbot für Typ-2-Diabetes",
      badge: "FORSCHUNGS-PROTOTYP",
      disclaimer: "⚠️ Lern-Prototyp — keine medizinische Beratung, kein Medizinprodukt. Persönliche Fragen gehören zu Arzt/Ärztin oder Ernährungsberatung.",
      send: "Senden", placeholder: 'Probier: "Ist Banane okay?" oder "Frühstücksideen"',
      paneltitle: "🔍 Lebensmittel-Ampel",
      panelhint: "Alltags-Bewertung bei Typ-2-Diabetes. Zeile anklicken, um danach zu fragen.",
      filter: "Lebensmittel filtern...", thfood: "Lebensmittel", thcarb: "KH/100g",
      footer: "Läuft lokal auf diesem Computer · keine Daten verlassen das Gerät · Wissensbasis: kuratierte Näherungswerte (USDA / GI-Tabellen / ADA- & NHS-Leitlinien)",
      typing: "NutriCoach denkt nach…", lost: "Verbindung weg - läuft NutriCoach noch?",
      per100: "pro 100 g", carbs: "Kohlenhydrate", ofSugar: "davon Zucker", fiber: "Ballaststoffe", protein: "Eiweiß",
      energy: "Energie", gi: "Glykämischer Index", giNeg: "vernachlässigbar", giBands: ["niedrig", "mittel", "hoch"],
      ask: n => `Ist ${n} okay?`, best: "freundlichere Wahl",
      plate: ["½ stärkearmes Gemüse", "¼ mageres Eiweiß", "¼ gute Kohlenhydrate"],
      plateTitle: "Der Diabetes-Teller", greetWord: "hallo",
    }
  };
  let lang = "en";
  try { lang = localStorage.getItem("nc-lang") || ((navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en"); } catch (e) {}
  const T = () => L[lang];

  const messagesEl = document.getElementById('messages');
  const chipsEl = document.getElementById('chips');
  const formEl = document.getElementById('form');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  const rowsEl = document.getElementById('foodrows');
  const searchEl = document.getElementById('foodsearch');

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function md(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(el => { el.textContent = T()[el.dataset.i]; });
    inputEl.placeholder = T().placeholder;
    searchEl.placeholder = T().filter;
    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    document.getElementById('lang-de').classList.toggle('active', lang === 'de');
    loadFoods();
  }
  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem('nc-lang', l); } catch (e) {}
    applyLang();
    messagesEl.innerHTML = '';
    greet();
  }
  document.getElementById('lang-en').onclick = () => setLang('en');
  document.getElementById('lang-de').onclick = () => setLang('de');

  // ---------- visuals ----------
  function giBand(gi) { return gi <= 55 ? 0 : (gi <= 69 ? 1 : 2); }
  function giScale(gi) {
    if (gi === null || gi === undefined) return `<div class="giscale"><div class="lab"><span>${T().gi}</span><b>${T().giNeg}</b></div></div>`;
    const pct = Math.max(2, Math.min(98, gi));
    return `<div class="giscale">
      <div class="lab"><span>${T().gi}</span><b>${gi} · ${T().giBands[giBand(gi)]}</b></div>
      <div class="gitrack"><div class="gz g"></div><div class="gz y"></div><div class="gz r"></div><div class="gmark" style="left:${pct}%"></div></div>
      <div class="gnums"><span>0</span><span>55</span><span>70</span><span>100</span></div></div>`;
  }
  function bar(label, value, cls, sub) {
    const w = v => Math.min(100, (v / 60) * 100).toFixed(1);
    const subHtml = sub !== undefined ? `<div class="fill sugar" style="width:${w(sub)}%"></div>` : '';
    return `<div class="macro"><div class="lab"><span>${label}${sub !== undefined ? ` <span style="opacity:.75">(${T().ofSugar}: ${sub} g)</span>` : ''}</span><b>${value} g</b></div>
      <div class="track"><div class="fill ${cls}" style="width:${w(value)}%"></div>${subHtml}</div></div>`;
  }
  function cardHtml(c, extra) {
    return `<div class="card ${extra || ''}">
      <div class="head"><span><span class="dot ${c.light}"></span>${esc(c.name)}</span><span style="font-weight:400;color:var(--muted);font-size:11px">${T().per100}</span></div>
      <div class="body">
        ${bar(T().carbs, c.carbs_g, 'carb', c.sugar_g)}
        ${bar(T().fiber, c.fiber_g, 'fiber')}
        ${bar(T().protein, c.protein_g, 'prot')}
        ${giScale(c.gi)}
        <div class="kcalrow"><span>${T().energy}</span><b>${c.kcal} kcal</b></div>
      </div></div>`;
  }
  function duelHtml(cards, winner) {
    return `<div class="duel">` + cards.map(c =>
      `<div class="card ${c.name === winner ? 'win' : ''}">
        <div class="head"><span style="font-size:12px"><span class="dot ${c.light}"></span>${esc(c.name)}</span>${c.name === winner ? `<span class="winchip">✓ ${T().best}</span>` : ''}</div>
        <div class="body">${bar(T().carbs, c.carbs_g, 'carb')}${giScale(c.gi)}</div>
      </div>`).join('') + `</div>`;
  }
  function plateHtml() {
    const p = T().plate;
    return `<div class="plate">
      <svg width="132" height="132" viewBox="0 0 140 140" role="img" aria-label="${T().plateTitle}">
        <circle cx="70" cy="70" r="66" fill="#fff" stroke="var(--line)" stroke-width="2"/>
        <path d="M70,10 A60,60 0 0 0 70,130 Z" fill="#cfe8d8" stroke="#1a9850" stroke-width="1.5"/>
        <path d="M70,70 L70,10 A60,60 0 0 1 130,70 Z" fill="#dbe7f5" stroke="#0072b2" stroke-width="1.5"/>
        <path d="M70,70 L130,70 A60,60 0 0 1 70,130 Z" fill="#f6e8c8" stroke="#d9a400" stroke-width="1.5"/>
        <text x="40" y="74" font-size="20" text-anchor="middle">🥦</text>
        <text x="99" y="49" font-size="18" text-anchor="middle">🍗</text>
        <text x="99" y="106" font-size="18" text-anchor="middle">🍚</text>
      </svg>
      <div class="legend">
        <div><span class="sw" style="background:#cfe8d8;border:1px solid #1a9850"></span>${p[0]}</div>
        <div><span class="sw" style="background:#dbe7f5;border:1px solid #0072b2"></span>${p[1]}</div>
        <div><span class="sw" style="background:#f6e8c8;border:1px solid #d9a400"></span>${p[2]}</div>
      </div></div>`;
  }

  // ---------- chat ----------
  function addUser(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="msg">${esc(text)}</div>`;
    messagesEl.appendChild(row);
    scroll();
  }
  function addBot(data) {
    const row = document.createElement('div');
    row.className = 'row bot';
    let html = md(data.reply);
    if (data.intent === 'meal_ideas') html = plateHtml() + `<div style="margin-top:10px">${html}</div>`;
    if (data.cards) html += duelHtml(data.cards, data.winner);
    else if (data.card) html += cardHtml(data.card);
    const tags = [`intent: ${esc(data.intent)}`].concat((data.sources || []).map(s => `${lang === 'de' ? 'Quelle' : 'source'}: ${esc(s)}`));
    html += `<div class="meta">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
    row.innerHTML = `<div class="avatar">🥗</div><div class="msg">${html}</div>`;
    messagesEl.appendChild(row);
    renderChips(data.suggestions || []);
    scroll();
  }
  function renderChips(suggestions) {
    chipsEl.innerHTML = '';
    suggestions.forEach(s => {
      const b = document.createElement('span');
      b.className = 'chip';
      b.textContent = s;
      b.onclick = () => send(s);
      chipsEl.appendChild(b);
    });
  }
  function scroll() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  let busy = false, silent = false;
  async function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    busy = true; sendEl.disabled = true;
    if (!silent) addUser(text);
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = T().typing;
    messagesEl.appendChild(typing); scroll();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, lang })
      });
      const data = await res.json();
      typing.remove();
      addBot(data);
    } catch (e) { typing.textContent = T().lost; }
    busy = false; sendEl.disabled = false; inputEl.focus();
  }
  function greet() { silent = true; send(T().greetWord).then(() => { silent = false; }); }
  formEl.addEventListener('submit', e => { e.preventDefault(); const t = inputEl.value; inputEl.value = ''; send(t); });

  // ---------- food side panel ----------
  let allFoods = [];
  function loadFoods() {
    fetch('/api/foods?lang=' + lang).then(r => r.json()).then(d => { allFoods = d.foods; renderFoods(); }).catch(() => {});
  }
  function renderFoods() {
    const q = searchEl.value.trim().toLowerCase();
    rowsEl.innerHTML = '';
    allFoods.filter(f => !q || f.name.toLowerCase().includes(q) || f.category.toLowerCase().includes(q)).forEach(f => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><span class="dot ${f.light}"></span>${esc(f.name)}</td><td>${f.carbs_g} g</td><td>${f.gi === null ? '–' : f.gi}</td>`;
      tr.onclick = () => send(T().ask(f.name));
      rowsEl.appendChild(tr);
    });
  }
  searchEl.addEventListener('input', renderFoods);

  // ---------- heartbeat: keeps the desktop app alive while a window is open ----------
  setInterval(() => { fetch('/api/ping').catch(() => {}); }, 20000);

  applyLang();
  greet();
</script>
</body>
</html>
